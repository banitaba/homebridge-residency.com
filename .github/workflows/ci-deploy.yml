name: homebridge-residency CI and deploy

# Server-wide standard (see scripts/deployment/deploy-server.py header):
# verify -> package release.tar.gz -> ssh homebridge-residency-deploy@host "deploy <sha> <sha256>" < release.tar.gz

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebridge-residency-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Deployment receiver tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m py_compile scripts/deployment/deploy-server.py
      - name: Site sanity
        run: test -f index.html
      - name: Package the site
        if: github.event_name != 'pull_request'
        env:
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          # Tracked files only; no .git, dotfiles, workflows or deploy scripts are published.
          git archive --format=tar HEAD -- . ':(exclude).github' ':(exclude)scripts' | tar -x -C release
          find release -mindepth 1 -name '.*' ! -name '.well-known' -prune -exec rm -rf {} +
          printf '{"commit":"%s"}\n' "$RELEASE_SHA" > release/release.json
          tar -czf release.tar.gz -C release .
          sha256sum release.tar.gz > release.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: homebridge-residency-${{ github.sha }}
          path: |
            release.tar.gz
            release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  deploy:
    name: Deploy production
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://homebridge-residency.com/
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: homebridge-residency-${{ github.sha }}
      - name: Verify artifact and deploy through restricted SSH command
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check release.tar.gz.sha256
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          trap 'rm -rf "$RUNNER_TEMP/deploy-ssh"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/"*
          ARTIFACT_SHA=$(sha256sum release.tar.gz | cut -d ' ' -f 1)
          ssh -T -i "$RUNNER_TEMP/deploy-ssh/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ForwardAgent=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "homebridge-residency-deploy@$DEPLOY_HOST" "deploy $RELEASE_SHA $ARTIFACT_SHA" < release.tar.gz
      - name: Public check
        run: curl --fail --silent --show-error --retry 3 --retry-delay 3 -o /dev/null https://homebridge-residency.com/
